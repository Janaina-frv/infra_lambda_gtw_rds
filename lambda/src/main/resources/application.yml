spring:
  datasource:
    url: jdbc:postgresql://ms-medicamentos-db.cklekc2ucy81.us-east-1.rds.amazonaws.com:5432/ms_medicamentosdb
    username: dbadmin
    password: dbadmin1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: public
    default-schema: public
    table: flyway_schema_history

logging:
  level:
    org.flywaydb: INFO
