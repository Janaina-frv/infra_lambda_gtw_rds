name: Deploy or Destroy AWS Infra (VPC + RDS + Lambda + API Gateway)

on:
  push:
    branches:
      - develop

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: 757367947438
      TF_ACTION: apply  # apply | destroy

      # Lambda
      FUNCTION_NAME: items-api-lambda
      LAMBDA_JAR_NAME: lambda.jar

      # RDS
      DB_INSTANCE_IDENTIFIER: items-db

      # API Gateway
      API_NAME: items-api

      # VPC
      VPC_NAME: items-vpc

    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Configurar AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::757367947438:role/GitHubOIDCRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Build da Lambda (Java)
        working-directory: lambda
        run: |
          echo "🛠️ Build da Lambda..."
          ./gradlew clean build   # ou mvn package se usar Maven
          cp build/libs/*.jar ../infra/${{ env.LAMBDA_JAR_NAME }}

      - name: Verificar arquivo Lambda
        run: |
          ls -l infra/${{ env.LAMBDA_JAR_NAME }}

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.6.6

      - name: Terraform Init
        working-directory: infra
        run: terraform init

      - name: Terraform Validate
        working-directory: infra
        run: terraform validate

      - name: Terraform Apply
        if: env.TF_ACTION == 'apply'
        working-directory: infra
        run: terraform apply -auto-approve -var="db_password=${{ secrets.DB_PASSWORD }}"

      - name: Terraform Destroy
        if: env.TF_ACTION == 'destroy'
        working-directory: infra
        run: terraform destroy -auto-approve -var="db_password=${{ secrets.DB_PASSWORD }}"
